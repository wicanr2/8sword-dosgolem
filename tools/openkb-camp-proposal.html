<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>神州八劍・新增兵種招募方案</title>
<style>*{box-sizing:border-box}body{margin:0;background:#061f18;color:#f6eaca;font:16px/1.5 "Noto Sans CJK TC","Noto Sans CJK SC",sans-serif}main{max-width:1200px;margin:auto;padding:22px}h1{margin:0;color:#e2c580;font-size:29px}p{margin:8px 0}.muted{color:#b3c4ad}.notice{border-left:4px solid #c4a14d;padding:8px 14px;background:#102f23}button,select{font:inherit;color:inherit;background:#193d2e;border:1px solid #77977c;border-radius:4px;padding:8px 12px}button{cursor:pointer}button.active{background:#763426;border-color:#e2c580}button:disabled{opacity:.5;cursor:default}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}select{max-width:100%}.source{padding:12px 16px;border:1px solid #8fa488;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:98px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.unit{border:1px solid #77977c;background:#113729;padding:12px;display:grid;grid-template-columns:90px 1fr;gap:8px;min-height:183px}.unit img{width:90px;height:125px;object-fit:contain}.unit h2{font-size:19px;margin:0;color:#e2c580}.unit p{font-size:14px;margin:3px 0}.unit button{padding:4px 9px;font-size:14px}.locked{opacity:.62}.banner{padding:10px 14px;min-height:49px;background:#102b22;border:1px solid #b39a58;margin-top:12px}footer{font-size:13px;color:#afc1a6;margin-top:12px}.pill{border:1px solid #b39a58;padding:1px 7px;border-radius:3px;font-size:13px}#mode-desc{min-height:49px}#summary{font-weight:700;color:#e2c580}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.source{display:block}}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style>
<style>#camp{width:375px;max-width:calc(100vw - 110px)}.bar label{max-width:100%}</style>
<main><h1>神州八劍・新增兵種招募方案</h1><p class="notice">可丟棄的操作樣張。只試算，不會招募、改記憶體或寫存檔。八種兵的數值仍是既有試作資料。</p>
<div class="bar"><button id="a" class="active" onclick="setMode('a')">A　保留原店＋增援分頁（建議）</button><button id="b" onclick="setMode('b')">B　指定營地改賣新兵</button></div><p id="mode-desc"></p>
<div class="bar"><label>原營地　<select id="camp" onchange="render()"></select></label><label>試算等級　<select id="rank" onchange="render()"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><span>示例金錢 5000・剩餘領導力 970</span></div>
<section class="source"><div id="original"></div><div id="summary"></div></section><div id="cards" class="grid"></div><p id="quote" class="banner">選擇兵種後可試算一名的招募限制。B 案點選兵種可切換該店的替換示意。</p>
<footer>原營地資料來自已保存的 2987-byte 進度與 120 筆固定欄位。庫存示例按「原店當前存量×原價÷新兵價格」向下取整，各新兵分開計算；這是提案，不是已定版的補貨規則。A 保留原兵種；B 隱藏該店原兵種。實際營地分配、補貨及保存契約須在選定分支後完成規格。</footer></main>
<script>const data=__PROPOSAL_DATA__;let mode='a',selected='openkb:wolf';const $=s=>document.querySelector(s);data.camps.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`第${c.region+1}區 ${c.name}營 (${c.x},${c.y})・${c.id}`;$('#camp').appendChild(o)});
function stock(c,u){return Math.floor(c.stock*c.gold/u.gold)}
function maximum(c,u){if(+$('#rank').value<u.rank)return 0;return Math.min(stock(c,u),Math.floor(data.sample.gold/u.gold),Math.floor((data.sample.leadership-data.sample.used)/u.command))}
function setMode(v){mode=v;$('#a').classList.toggle('active',v==='a');$('#b').classList.toggle('active',v==='b');render()}
function choose(id){selected=id;const c=data.camps[$('#camp').value],u=data.units.find(x=>x.id===id),m=maximum(c,u);$('#quote').textContent=`${u.name}：本例最多 ${m} 名；一名需 ${u.gold} 金、${u.command} 領導力，階級 ${u.rank}。${mode==='a'?'原店仍可購買原兵種。':'此店替換為 '+u.name+'，原兵種不再販售。'}`;render(false)}
function render(reset=true){const c=data.camps[$('#camp').value],rank=+$('#rank').value,u=data.units.find(x=>x.id===selected);$('#mode-desc').textContent=mode==='a'?'原營地保留，新增可選的增援分頁。八種新兵按既有階級限制開放，庫存與原兵種分開。':'為指定營地設定一種新兵。此頁僅示意單店替換，尚未指定哪八處營地；會改變原兵種的可取得位置。';$('#original').innerHTML=mode==='a'?`<span class="pill">原店保留</span><p><b>${c.name}</b>　價格 ${c.gold}　庫存 ${c.stock}</p>`:`<span class="pill">替換示意</span><p><b>${c.name} → ${u.name}</b>　候選庫存 ${stock(c,u)}</p>`;$('#summary').textContent=mode==='a'?'原兵種＋可選增援':'該店原兵種不再販售';$('#cards').innerHTML=data.units.map(u=>`<article class="unit ${u.rank>rank?'locked':''}"><img src="${u.portrait}" alt="${u.name}HD圖像"><div><h2>${u.name}</h2><p>單價 ${u.gold}・領導 ${u.command}</p><p>階級 ${u.rank}・候選庫存 ${stock(c,u)}</p><p>${u.rank>rank?'目前階級不足':'本例最多 '+maximum(c,u)+' 名'}</p><button data-unit="${u.id}" onclick="choose('${u.id}')">${mode==='a'?'試算一名':'選作替換示意'}</button></div></article>`).join('');if(reset)$('#quote').textContent='操作只改這張樣張，不影響遊戲或存檔。'}
window.proposalState=()=>({mode,selected,camp:data.camps[$('#camp').value].id,rank:+$('#rank').value,originalKept:mode==='a',cards:$('#cards').children.length,quote:$('#quote').textContent});render();</script></html>
