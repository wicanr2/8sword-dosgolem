<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Go世界交接試作</title><style>body{margin:0;background:#102b28;color:#f7eccd;font:18px/1.7 system-ui}main{max-width:900px;margin:auto;padding:28px}section{border:1px solid #b99b5c;padding:20px;margin:20px 0;border-radius:10px}button{font:inherit;background:#e5ca89;border:0;border-radius:6px;padding:10px 16px;margin:5px;cursor:pointer}input{width:100%}strong{color:#ffdc83}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stats div{background:#193d35;padding:12px}h1{font-size:28px}</style><main><h1>Go世界交接試作</h1><p>已串起招募、戰鬥、獎勵、晉級與存讀。這是資料流程回放，尚未接入遊戲內的軍隊與戰鬥介面。</p><section><button id="back">上一步</button><button id="next">下一步</button><button id="end">看結算</button><input id="step" type="range" min="0" max="29" value="0"><p id="message" role="status"></p><div class="stats" id="stats"></div></section><section><h2>這輪已驗證</h2><p>30隻野狼迎戰15名骷髏兵，完成28次Go行動後剩29隻。勝利獲得600金錢與22點戰績，等級1升至2。招募庫存維持970。</p><p>戰中與戰後各由另一個程序讀回。已行動部隊不能再動，已清除敵軍不能再次開戰，戰果不能重複領取，舊狀態不能覆寫新存檔。</p><p>原版正常路徑已抽驗遇敵、撤退、扣款與回地圖。七組勝利數值控制另以原版常式驗證。敗退、任務獎勵及新增兵種的正式玩家介面仍待接入。</p></section></main><script>const data={"initial": {"schema": "eightsword-owned-world/1", "revision": 0, "army": {"gold": 3800, "leadership": 1000, "recruit_rank": 1, "rules": "tactics", "slots": [{"unit": "openkb:wolf", "count": 30}, {"unit": "", "count": 0}, {"unit": "", "count": 0}, {"unit": "", "count": 0}, {"unit": "", "count": 0}, {"unit": "", "count": 0}], "offers": {"wolf-camp": {"unit": "openkb:wolf", "stock": 970}}}, "progress": {"rank": 1, "merit": 1990, "legacy_04f6": 100, "legacy_04fc": 10, "thresholds": [0, 2000, 5000, 8000, 12000, 30000]}, "encounters": {"skeleton-patrol": {"enemy": [{"unit": "openkb:skel", "count": 15}, {"unit": "", "count": 0}, {"unit": "", "count": 0}, {"unit": "", "count": 0}, {"unit": "", "count": 0}, {"unit": "", "count": 0}], "cleared": false}}, "battle": null}, "events": [{"action": {"side": 1, "sourc
