function setMode(v){mode=v;$('#a').classList.toggle('active',v==='a');$('#b').classList.toggle('active',v==='b');render()}
function choose(id){selected=id;const c=data.camps[$('#camp').value],u=data.units.find(x=>x.id===id),m=maximum(c,u);$('#quote').textContent=`${u.name}：本例最多 ${m} 名；一名需 ${u.gold} 金、${u.command} 領導力，階級 ${u.rank}。${mode==='a'?'原店仍可購買原兵種。':'此店替換為 '+u.name+'，原兵種不再販售。'}`;render(false)}
function render(reset=true){const c=data.camps[$('#camp').value],rank=+$('#rank').value,u=data.units.find(x=>x.id===selected);$('#mode-desc').textContent=mode==='a'?'原營地保留，新增可選的增援分頁。八種新兵按既有階級限制開放，庫存與原兵種分開。':'為指定營地設定一種新兵。此頁僅示意單店替換，尚未指定哪八處營地；會改變原兵種的可取得位置。';$('#original').innerHTML=mode==='a'?`<span class="pill">原店保留</span><p><b>${c.name}</b>　價格 ${c.gold}　庫存 ${c.stock}</p>`:`<span class="pill">替換示意</span><p><b>${c.name} → ${u.name}</b>　候選庫存 ${stock(c,u)}</p>`;$('#summary').textContent=mode==='a'?'原兵種＋可選增援':'該店原兵種不再販售';$('#cards').innerHTML=data.units.map(u=>`<article class="unit ${u.rank>rank?'locked':''}"><img src="${u.portrait}" alt="${u.name}HD圖像"><div><h2>${u.name}</h2><p>單價 ${u.gold}・領導 ${u.command}</p><p>階級 ${u.rank}・候選庫存 ${stock(c,u)}</p><p>${u.rank>rank?'目前階級不足':'本例最多 '+maximum(c,u)+' 名'}</p><button data-unit="${u.id}" onclick="choose('${u.id}')">${mode==='a'?'試算一名':'選作替換示意'}</button></div></article>`).join('');if(reset)$('#quote').textContent='操作只改這張樣張，不影響遊戲或存檔。'}
window.proposalState=()=>({mode,selected,camp:data.camps[$('#camp').value].id,rank:+$('#rank').value,originalKept:mode==='a',cards:$('#cards').children.length,quote:$('#quote').textContent});render();</script></html>
